<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>World Translator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: vertical;
      font-size: 16px;
    }

    select {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: #f1f3f5;
      border-radius: 12px;
      min-height: 100px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌍 World Translator</h1>

    <p class="subtitle">
      Translate text into the language you understand.
    </p>

    <textarea id="textInput"
      placeholder="Type or paste text here..."></textarea>

    <select id="language">
      <option value="en">English</option>
      <option value="zh">Chinese</option>
      <option value="fr">French</option>
      <option value="es">Spanish</option>
      <option value="de">German</option>
      <option value="ar">Arabic</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
    </select>

    <button onclick="translateText()">
      Translate
    </button>

    <div class="result" id="result">
      Your translation will appear here.
    </div>

  </div>

  <script>
    async function translateText() {

      const text = document.getElementById("textInput").value;
      const language = document.getElementById("language").value;
      const result = document.getElementById("result");

      if (!text.trim()) {
        result.innerText = "Please enter some text first.";
        return;
      }

      result.innerText = "Translating...";

      try {

        const url =
          "https://api.mymemory.translated.net/get?q=" +
          encodeURIComponent(text) +
          "&langpair=auto|" +
          language;

        const response = await fetch(url);

        const data = await response.json();

        result.innerText =
          data.responseData.translatedText;

      } catch (error) {

        result.innerText =
          "Sorry, translation failed. Please try again.";

      }
    }
  </script>

</body>
</html>
